name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  offline-ci:
    name: Offline checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_FROZEN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install locked dependencies
        run: uv sync --group dev

      - name: Run offline CI suite
        run: make ci

  container-smoke:
    name: Container build and deterministic RAG smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and smoke-test runtime image
        run: make docker-smoke DOCKER_IMAGE=agentic-eval-toyapp:ci DOCKER_SMOKE_TIMEOUT=240

services:
  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  toyapp:
    image: ${TOYAPP_DOCKER_IMAGE:-agentic-eval-toyapp:local}
    env_file:
      - .env
    environment:
      TOYAPP_HOST: 0.0.0.0
      TOYAPP_PORT: 8000
      TOYAPP_GENERATION_PROVIDER: ${TOYAPP_GENERATION_PROVIDER:-openai}
      TOYAPP_LANGFUSE_ENABLED: ${TOYAPP_LANGFUSE_ENABLED:-false}
      TOYAPP_EMBEDDING_CACHE_DIR: /opt/models
      TOYAPP_EMBEDDING_LOCAL_FILES_ONLY: "true"
      TOYAPP_SESSION_STORE_BACKEND: redis
      TOYAPP_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${TOYAPP_PORT:-8000}:8000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  redis-data:

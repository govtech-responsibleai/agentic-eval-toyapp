[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-eval-toyapp"
version = "0.1.0"
description = "A controlled RAG target application for agentic evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "jinja2>=3.1",
    "langfuse>=4.7,<5",
    "numpy>=2.0",
    "openai>=1.40",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "torch>=2.0",
    "uvicorn>=0.53.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_eval_toyapp"]

[tool.uv]
package = true
required-version = ">=0.12.7"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "trace_cases", "scripts"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
src = ["src", "tests", "trace_cases", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length is enforced by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p no:rerunfailures -m 'not live and not model_live and not langfuse_live'"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "live: requires a network service or separately downloaded model artefact",
    "model_live: requires live model credentials, network access, and may incur cost",
    "langfuse_live: requires live Langfuse credentials and network access",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1",
    "pytest>=9.1.1",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-eval-toyapp"
version = "0.1.0"
description = "A controlled RAG target application for agentic evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_eval_toyapp"]

[tool.uv]
package = true
required-version = ">=0.12.7,<0.13"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line length is enforced by the formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
addopts = "-p no:rerunfailures"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.1.1",
    "ruff>=0.11",
]
